<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Soccer Markov Game — Nash Explorer</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI', system-ui, sans-serif;
  background: #f5f6fa; color: #1a1a2e;
  min-height: 100vh; padding: 24px;
}
.header { margin-bottom: 20px; }
.header h1 { font-size: 20px; font-weight: 700; }
.header p  { font-size: 13px; color: #666; margin-top: 3px; }

/* Mode toggle */
.mode-toggle {
  display: inline-flex; gap: 0; margin-bottom: 20px;
  border-radius: 10px; overflow: hidden; border: 1.5px solid #d0d0e0;
  background: #fff;
}
.mtog {
  padding: 9px 22px; border: none; background: #fff;
  cursor: pointer; font-size: 13px; font-weight: 600; color: #888;
  transition: all .15s;
}
.mtog.on { background: #1a1a2e; color: #fff; }

/* Layout */
.layout { display: flex; gap: 20px; flex-wrap: wrap; align-items: flex-start; }

/* Board panel */
.board-panel {
  background: #fff; border-radius: 14px; padding: 20px;
  box-shadow: 0 2px 12px rgba(0,0,0,.08); flex: 0 0 auto;
}
.board-panel h2 {
  font-size: 12px; font-weight: 600; color: #aaa;
  text-transform: uppercase; letter-spacing: .5px; margin-bottom: 12px;
}

/* Ball toggle */
.ball-toggle { display: flex; gap: 8px; margin-bottom: 14px; }
.btog {
  flex: 1; padding: 8px; border-radius: 8px; border: 2px solid #e0e0e0;
  background: #fff; cursor: pointer; font-size: 13px; font-weight: 600;
  color: #888; transition: all .15s;
}
.btog.p0on { border-color: #3b82f6; background: #eff6ff; color: #3b82f6; }
.btog.p1on { border-color: #ef4444; background: #fef2f2; color: #ef4444; }

#board-svg { display: block; }
.board-foot { font-size: 11px; color: #bbb; margin-top: 8px; text-align: center; }

/* Right panel */
.right-panel { flex: 1; min-width: 320px; display: flex; flex-direction: column; gap: 14px; }

.card {
  background: #fff; border-radius: 14px; padding: 18px;
  box-shadow: 0 2px 12px rgba(0,0,0,.08);
}
.card h2 {
  font-size: 12px; font-weight: 600; color: #aaa;
  text-transform: uppercase; letter-spacing: .5px; margin-bottom: 12px;
  display: flex; align-items: center; gap: 8px;
}

/* Tags */
.state-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.tag { border-radius: 7px; padding: 4px 11px; font-size: 12px; font-weight: 600; }

/* Policy bars */
.policy-label {
  font-size: 11px; font-weight: 600; color: #aaa;
  text-transform: uppercase; letter-spacing: .4px; margin-bottom: 5px;
}
.pol-row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.pol-sym { font-size: 15px; width: 18px; text-align: center; }
.pol-track { flex: 1; background: #f0f0f0; border-radius: 4px; height: 21px; overflow: hidden; }
.pol-fill {
  height: 100%; border-radius: 4px; display: flex; align-items: center;
  padding: 0 7px; font-size: 11px; font-weight: 700; color: #fff;
}
.pol-pct { font-size: 12px; font-family: monospace; width: 36px; text-align: right; color: #888; }

/* Q matrix */
.qmat-wrap { overflow-x: auto; }
.qmat { width: 100%; border-collapse: collapse; font-size: 12px; }
.qmat th {
  background: #f8f9fa; color: #666; padding: 7px 9px;
  text-align: center; border: 1px solid #ebebeb; font-weight: 600; font-size: 11px;
}
.qmat td {
  padding: 7px 9px; text-align: center; border: 1px solid #ebebeb;
  font-family: 'Courier New', monospace; font-size: 12px;
}
.qmat .row-hdr { background: #f8f9fa; color: #555; font-weight: 600; text-align: left; }
.qmat .best  { background: #f0fdf4; color: #16a34a; font-weight: 700; }
.qmat .worst { background: #fef2f2; color: #dc2626; }
.qmat .nash  { background: #eff6ff; color: #2563eb; font-weight: 700; outline: 2px solid #93c5fd; outline-offset: -2px; }

.legend { display: flex; gap: 14px; margin-top: 8px; font-size: 11px; color: #aaa; flex-wrap: wrap; }
.legend .li { display: flex; align-items: center; gap: 4px; }
.legend .dot { width: 10px; height: 10px; border-radius: 2px; }
</style>
</head>
<body>

<div class="header">
  <h1>⚽ Soccer Markov Game — Nash Equilibrium Explorer</h1>
  <p>Deterministic A10 rules &middot; Pure &plusmn;1 reward &middot; &gamma;&nbsp;=&nbsp;0.9 &middot; Click a cell to place the selected player</p>
</div>

<div class="mode-toggle">
  <button class="mtog on" id="m-det" onclick="setMode('det')">Deterministic &nbsp;(0 mixed)</button>
  <button class="mtog"    id="m-sto" onclick="setMode('sto')">Stochastic coin-flip &nbsp;(68 mixed)</button>
</div>

<div class="layout">

  <div class="board-panel">
    <h2>Board</h2>
    <div class="ball-toggle">
      <button class="btog p0on" id="tog0" onclick="setBall(0)">&#9917; P0 has ball</button>
      <button class="btog"      id="tog1" onclick="setBall(1)">&#9917; P1 has ball</button>
    </div>
    <svg id="board-svg" xmlns="http://www.w3.org/2000/svg"></svg>
    <div class="board-foot">Blue right edge = P0 goal &nbsp;&middot;&nbsp; Red left edge = P1 goal</div>
  </div>

  <div class="right-panel">

    <div class="card">
      <h2>State &nbsp;<span id="ne-badge" style="font-size:11px;font-weight:600;padding:2px 8px;border-radius:5px;text-transform:none;letter-spacing:0"></span></h2>
      <div class="state-row" id="state-tags"></div>
      <div id="pol-p0"></div>
      <div id="pol-p1"></div>
    </div>

    <div class="card">
      <h2>Q-Matrix <span id="qmat-lbl" style="font-weight:400;color:#ccc;font-size:11px;text-transform:none;letter-spacing:0"></span></h2>
      <div class="qmat-wrap"><table class="qmat" id="qmat"></table></div>
      <div class="legend">
        <div class="li"><div class="dot" style="background:#f0fdf4;outline:1px solid #86efac;outline-offset:0"></div>Best for P0</div>
        <div class="li"><div class="dot" style="background:#fef2f2;outline:1px solid #fca5a5;outline-offset:0"></div>Worst for P0</div>
        <div class="li"><div class="dot" style="background:#eff6ff;outline:2px solid #93c5fd;outline-offset:-1px"></div>Nash cell</div>
      </div>
    </div>

  </div>
</div>

var ACT=['U','D','L','R'], ARR=['↑','↓','←','→'];
var ACOL=['#3b82f6','#f59e0b','#8b5cf6','#10b981'];
var P0C='#3b82f6', P1C='#ef4444';
var W=7,H=5,CS=64,PAD=10,GAP=3;
var mode='det';
var st={x0:1,y0:2,x1:6,y1:2,ball:0,placing:0};

function svgEl(tag,attrs,txt){
  var e=document.createElementNS('http://www.w3.org/2000/svg',tag);
  for(var k in attrs) e.setAttribute(k,attrs[k]);
  if(txt!==undefined) e.textContent=txt;
  return e;
}
function cx(x){return PAD+x*(CS+GAP)+CS/2;}
function cy(y){return PAD+(H-1-y)*(CS+GAP)+CS/2;}
function cellX(x){return PAD+x*(CS+GAP);}
function cellY(y){return PAD+(H-1-y)*(CS+GAP);}

function setMode(m){
  mode=m;
  document.getElementById('m-det').className='mtog'+(m==='det'?' on':'');
  document.getElementById('m-sto').className='mtog'+(m==='sto'?' on':'');
  draw(); update();
}
function setBall(b){
  st.ball=b;
  document.getElementById('tog0').className='btog'+(b===0?' p0on':'');
  document.getElementById('tog1').className='btog'+(b===1?' p1on':'');
  draw(); update();
}
function placePlayer(x,y){
  if(st.placing===0){
    if(x===st.x1&&y===st.y1) return;
    st.x0=x; st.y0=y; st.placing=1;
  } else {
    if(x===st.x0&&y===st.y0) return;
    st.x1=x; st.y1=y; st.placing=0;
  }
  draw(); update();
}

function draw(){
  var svg=document.getElementById('board-svg');
  var bw=PAD*2+W*(CS+GAP)-GAP, bh=PAD*2+H*(CS+GAP)-GAP+20;
  svg.setAttribute('width',bw); svg.setAttribute('height',bh);
  svg.innerHTML='';

  var x0=st.x0,y0=st.y0,x1=st.x1,y1=st.y1,ball=st.ball;
  var d=DATA[mode][[x0,y0,x1,y1,ball].join(',')];

  // Background
  svg.appendChild(svgEl('rect',{width:bw,height:bh,fill:'#f8f9fa',rx:10}));

  // Goal zones
  svg.appendChild(svgEl('rect',{x:cellX(W-1),y:PAD,width:CS,height:H*(CS+GAP)-GAP,fill:'rgba(59,130,246,0.06)',rx:5}));
  svg.appendChild(svgEl('rect',{x:cellX(W-1)+CS-4,y:PAD,width:4,height:H*(CS+GAP)-GAP,fill:P0C,rx:2}));
  svg.appendChild(svgEl('rect',{x:PAD,y:PAD,width:CS,height:H*(CS+GAP)-GAP,fill:'rgba(239,68,68,0.06)',rx:5}));
  svg.appendChild(svgEl('rect',{x:PAD,y:PAD,width:4,height:H*(CS+GAP)-GAP,fill:P1C,rx:2}));

  // Cells
  for(var y=0;y<H;y++) for(var x=0;x<W;x++){
    var px=cellX(x),py=cellY(y);
    var isP0=x===x0&&y===y0,isP1=x===x1&&y===y1;
    var fill=isP0?'#dbeafe':isP1?'#fee2e2':'#fff';
    var stroke=isP0?P0C:isP1?P1C:'#e8e8e8';
    var cell=svgEl('rect',{x:px,y:py,width:CS,height:CS,fill:fill,stroke:stroke,'stroke-width':isP0||isP1?2:1,rx:7});
    cell.style.cursor='pointer';
    (function(cx_,cy_){cell.addEventListener('click',function(){placePlayer(cx_,cy_);});})(x,y);
    svg.appendChild(cell);
    svg.appendChild(svgEl('text',{x:px+4,y:py+11,fill:'#ddd','font-size':9,'font-family':'monospace'},'('+x+','+y+')'));
    if(isP0){
      svg.appendChild(svgEl('text',{x:px+CS/2,y:py+CS/2+5,fill:P0C,'font-size':20,'font-weight':'bold','text-anchor':'middle','font-family':'sans-serif'},'0'));
      svg.appendChild(svgEl('text',{x:px+CS/2,y:py+CS-7,fill:P0C,'font-size':9,'font-weight':'bold','text-anchor':'middle','font-family':'sans-serif'},'P0'+(ball===0?' ⚽':'')));
    }
    if(isP1){
      svg.appendChild(svgEl('text',{x:px+CS/2,y:py+CS/2+5,fill:P1C,'font-size':20,'font-weight':'bold','text-anchor':'middle','font-family':'sans-serif'},'1'));
      svg.appendChild(svgEl('text',{x:px+CS/2,y:py+CS-7,fill:P1C,'font-size':9,'font-weight':'bold','text-anchor':'middle','font-family':'sans-serif'},'P1'+(ball===1?' ⚽':'')));
    }
  }

  // Arrows
  if(d){ drawArrows(svg,d.pi0,x0,y0,P0C); drawArrows(svg,d.pi1,x1,y1,P1C); }

  // Axis labels
  for(var x=0;x<W;x++)
    svg.appendChild(svgEl('text',{x:cx(x),y:PAD+H*(CS+GAP)+14,fill:'#ccc','font-size':10,'text-anchor':'middle','font-family':'sans-serif'},'x='+x));
}

function drawArrows(svg,pi,px,py,col){
  var dirs=[[0,1],[0,-1],[-1,0],[1,0]];
  // ensure defs
  var defs=svg.querySelector('defs');
  if(!defs){defs=svgEl('defs',{}); svg.insertBefore(defs,svg.firstChild);}

  for(var a=0;a<4;a++){
    var p=pi[a]; if(p<0.01) continue;
    var dx=dirs[a][0],dy=dirs[a][1];
    var nx=px+dx,ny=py+dy;
    if(nx<0||nx>=W||ny<0||ny>=H) continue;
    var thick=Math.max(1.5,Math.round(5*p));
    var alpha=Math.min(1,0.5+0.5*p);
    var x1s=cx(px)+dx*(CS*0.38), y1s=cy(py)-dy*(CS*0.38);
    var x2s=cx(nx)-dx*(CS*0.20), y2s=cy(ny)+dy*(CS*0.20);
    var mid='mk'+col.replace('#','')+'t'+Math.round(thick*10);
    if(!document.getElementById(mid)){
      var mk=svgEl('marker',{id:mid,markerWidth:8,markerHeight:8,refX:6,refY:4,orient:'auto'});
      mk.appendChild(svgEl('path',{d:'M0,1 L7,4 L0,7 L1.5,4 Z',fill:col,opacity:alpha}));
      defs.appendChild(mk);
    }
    svg.appendChild(svgEl('line',{x1:x1s,y1:y1s,x2:x2s,y2:y2s,stroke:'rgba(0,0,0,0.10)','stroke-width':thick+3,'stroke-linecap':'round'}));
    var ln=svgEl('line',{x1:x1s,y1:y1s,x2:x2s,y2:y2s,stroke:col,'stroke-width':thick,'stroke-linecap':'round',opacity:alpha,'marker-end':'url(#'+mid+')'});
    svg.appendChild(ln);
    // Label
    var lx=x2s+dx*14, ly=y2s-dy*14;
    svg.appendChild(svgEl('rect',{x:lx-12,y:ly-7,width:24,height:14,rx:3,fill:'rgba(255,255,255,0.9)'}));
    svg.appendChild(svgEl('text',{x:lx,y:ly+4,fill:col,'font-size':10,'font-weight':'bold','text-anchor':'middle','font-family':'sans-serif'},Math.round(p*100)+'%'));
  }
}

function policyBars(pi,label,col){
  var h='<div class="policy-label">'+label+'</div>';
  var mx=Math.max.apply(null,pi);
  pi.forEach(function(p,i){
    var w=Math.round(p*100); if(w===0) return;
    h+='<div class="pol-row">'+
      '<div class="pol-sym" style="color:'+col+'">'+ARR[i]+'</div>'+
      '<div class="pol-track"><div class="pol-fill" style="width:'+w+'%;background:'+col+';opacity:'+(p===mx?1:0.55)+'">'+(w>12?ACT[i]+'='+w+'%':'')+'</div></div>'+
      '<div class="pol-pct" style="color:'+col+'">'+w+'%</div>'+
    '</div>';
  });
  return h;
}

function update(){
  var x0=st.x0,y0=st.y0,x1=st.x1,y1=st.y1,ball=st.ball;
  var key=[x0,y0,x1,y1,ball].join(',');
  var d=DATA[mode][key];

  // NE badge
  var badge=document.getElementById('ne-badge');
  if(d){
    if(d.pure){ badge.textContent='Pure NE'; badge.style.cssText='background:#f0fdf4;color:#16a34a;font-size:11px;font-weight:600;padding:2px 8px;border-radius:5px;text-transform:none;letter-spacing:0'; }
    else      { badge.textContent='Mixed NE'; badge.style.cssText='background:#eff6ff;color:#2563eb;font-size:11px;font-weight:600;padding:2px 8px;border-radius:5px;text-transform:none;letter-spacing:0'; }
  } else { badge.textContent=''; }

  // Tags
  var vc=d?(d.V>0.005?'background:#f0fdf4;color:#16a34a':d.V<-0.005?'background:#fef2f2;color:#dc2626':'background:#f8f9fa;color:#555'):'background:#f8f9fa;color:#aaa';
  document.getElementById('state-tags').innerHTML=
    '<span class="tag" style="background:#eff6ff;color:#3b82f6">P0 ('+x0+','+y0+')</span>'+
    '<span class="tag" style="background:#fef2f2;color:#ef4444">P1 ('+x1+','+y1+')</span>'+
    '<span class="tag" style="background:#fef9ec;color:#b45309">Ball = P'+ball+'</span>'+
    (d?'<span class="tag" style="'+vc+'">V = '+(d.V>0?'+':'')+d.V+'</span>':'');

  if(!d){ document.getElementById('pol-p0').innerHTML=''; document.getElementById('pol-p1').innerHTML=''; document.getElementById('qmat').innerHTML=''; return; }

  document.getElementById('pol-p0').innerHTML=policyBars(d.pi0,'P0 Strategy',P0C);
  document.getElementById('pol-p1').innerHTML=policyBars(d.pi1,'P1 Strategy',P1C);

  // Q matrix
  document.getElementById('qmat-lbl').textContent='— ('+x0+','+y0+') vs ('+x1+','+y1+') ball=P'+ball;
  var Q=d.Q,p0=d.pi0,p1=d.pi1;
  var p0a=p0.map(function(v,i){return v>0.01?i:-1;}).filter(function(x){return x>=0;});
  var p1a=p1.map(function(v,i){return v>0.01?i:-1;}).filter(function(x){return x>=0;});
  var best=-999,besti=0,bestj=0,worst=999,worsti=0,worstj=0;
  for(var i=0;i<4;i++) for(var j=0;j<4;j++){
    if(Q[i][j]>best){best=Q[i][j];besti=i;bestj=j;}
    if(Q[i][j]<worst){worst=Q[i][j];worsti=i;worstj=j;}
  }
  var html='<tr><th>P0 &darr; \ P1 &rarr;</th>';
  for(var j=0;j<4;j++) html+='<th style="color:'+ACOL[j]+'">'+ARR[j]+' '+ACT[j]+'</th>';
  html+='</tr>';
  for(var i=0;i<4;i++){
    html+='<tr><td class="row-hdr" style="color:'+ACOL[i]+'">'+ARR[i]+' '+ACT[i]+'</td>';
    for(var j=0;j<4;j++){
      var v=Q[i][j];
      var isNash=p0a.indexOf(i)>=0&&p1a.indexOf(j)>=0;
      var isBest=i===besti&&j===bestj&&!isNash;
      var isWorst=i===worsti&&j===worstj&&!isNash&&best!==worst;
      var cls=isNash?'nash':isBest?'best':isWorst?'worst':'';
      var vstr=(v===0||Math.abs(v)<0.005)?'0.00':(v>0?'+':'')+v.toFixed(2);
      html+='<td class="'+cls+'">'+vstr+'</td>';
    }
    html+='</tr>';
  }
  document.getElementById('qmat').innerHTML=html;
}

// Init
(function(){
  var bw=PAD*2+W*(CS+GAP)-GAP;
  var bh=PAD*2+H*(CS+GAP)-GAP+20;
  var svg=document.getElementById('board-svg');
  svg.setAttribute('width',bw); svg.setAttribute('height',bh);
})();
draw(); update();
</script>
